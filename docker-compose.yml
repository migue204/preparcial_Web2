
services:
  postgres:
    image: postgres:16-alpine
    container_name: preparcial_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - preparcial_data:/var/lib/postgresql/data

volumes:
  preparcial_data:
